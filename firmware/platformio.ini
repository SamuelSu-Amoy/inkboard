; InkBoard 墨水屏固件（ESP32）
;
; 我们的两块屏（ESP32-C3 promini 板，LED 接 GPIO3）：
;   3.98" SE0398NZ07 A0 四色屏   env:epd_398_se0398nz07a0_c3_promini
;   4.2"  HINK SSD1683 三色屏    env:epd_42_hink_ssd1683_c3_promini
; 变体后缀：_led5 = LED 接 GPIO5 的旧板；_test = 每分钟唤醒的功能测试版；
;           _selftest = 不联网的屏幕自检图。
;
; 编译上传：pio run -e <环境> -t upload（不带 -e 只编译这两块屏）
; 详见 README.md。其它面板 / 开发板的环境在 boards/other_panels.ini。

[platformio]
default_envs = epd_398_se0398nz07a0_c3_promini, epd_42_hink_ssd1683_c3_promini
extra_configs = boards/other_panels.ini

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
board_build.extra_flags =
extra_scripts = post:merge_firmware.py
lib_deps =
    zinggjm/GxEPD2@^1.5.0
    adafruit/Adafruit GFX Library@^1.11.0
    links2004/WebSockets@^2.6.1

; ════ 我们的屏 ════════════════════════════════════════════════

; ── HINK 4.2" SSD1683 BWR三色屏 硬件SPI驱动 ─────────────────────────────────────────
[env:epd_42_hink_ssd1683_c3_promini]
extends = common
board = esp32-c3-devkitm-1
board_build.partitions = partitions/custom_wroom32e.csv
build_flags =
    -DBOARD_PROFILE_ESP32_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEPD_WIDTH=400
    -DEPD_HEIGHT=300
    -DEPD_PANEL_42_HINK_SSD1683
    -DEPD_BPP=2
    -DALLOW_INSECURE_FALLBACK=0

[env:epd_398_se0398nz07a0_c3_promini]
extends = common
board = esp32-c3-devkitm-1
board_build.partitions = partitions/custom_wroom32e.csv
build_flags =
    -DBOARD_PROFILE_ESP32_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEPD_WIDTH=768
    -DEPD_HEIGHT=552
    -DEPD_PANEL_398_SE0398NZ07A0
    -DEPD_COLOR_PAGED
    -DEPD_BPP=2
    -DALLOW_INSECURE_FALLBACK=0

; 3.98" SE0398NZ07 A1 (JD79661): same panel, the other controller version (look for
; "A1" on the FPC cable). Verified on A1 hardware (C3 promini).
[env:epd_398_se0398nz07a1_c3_promini]
extends = env:epd_398_se0398nz07a0_c3_promini
build_flags =
    ${env:epd_398_se0398nz07a0_c3_promini.build_flags}
    -DSE0398_A1

[env:epd_398_se0398nz07a1_c3_promini_led5]
extends = env:epd_398_se0398nz07a1_c3_promini
build_flags =
    ${env:epd_398_se0398nz07a1_c3_promini.build_flags}
    -DBOARD_VARIANT_C3_LED5

[env:epd_398_se0398nz07a1_c3_promini_selftest]
extends = env:epd_398_se0398nz07a1_c3_promini
build_flags =
    ${env:epd_398_se0398nz07a1_c3_promini.build_flags}
    -DEPD_SELFTEST

[env:epd_42_hink_ssd1683_c3_promini_led5]
extends = env:epd_42_hink_ssd1683_c3_promini
build_flags =
    ${env:epd_42_hink_ssd1683_c3_promini.build_flags}
    -DBOARD_VARIANT_C3_LED5

[env:epd_398_se0398nz07a0_c3_promini_led5]
extends = env:epd_398_se0398nz07a0_c3_promini
build_flags =
    ${env:epd_398_se0398nz07a0_c3_promini.build_flags}
    -DBOARD_VARIANT_C3_LED5

; ── 3.98" SE0398 A0 硬件自检（显示细节测试图，不联网；完成后保持唤醒并每 5 秒打印结果）──────────────
; 用来在真机上确认 1px 线条/棋盘格/1px 笔画文字/四色 的显示效果。
[env:epd_398_se0398nz07a0_c3_promini_selftest]
extends = env:epd_398_se0398nz07a0_c3_promini
build_flags =
    ${env:epd_398_se0398nz07a0_c3_promini.build_flags}
    -DEPD_SELFTEST

; 本地板（LED 接 GPIO5）的自检版本；屏幕引脚与上游板完全相同
[env:epd_398_se0398nz07a0_c3_promini_selftest_led5]
extends = env:epd_398_se0398nz07a0_c3_promini_selftest
build_flags =
    ${env:epd_398_se0398nz07a0_c3_promini_selftest.build_flags}
    -DBOARD_VARIANT_C3_LED5

; ── ESP32 功能测试版（DEBUG_MODE=1：每 1 分钟真实深睡唤醒一次）────────────
; 配合 tools/mock_server.py 使用，测试配网/拉图/离线缓存/深睡/按键唤醒/电压上报。
[env:epd_42_hink_ssd1683_c3_promini_test]
extends = env:epd_42_hink_ssd1683_c3_promini
build_flags =
    ${env:epd_42_hink_ssd1683_c3_promini.build_flags}
    -DDEBUG_MODE=1

[env:epd_42_hink_ssd1683_c3_promini_test_led5]
extends = env:epd_42_hink_ssd1683_c3_promini_test
build_flags =
    ${env:epd_42_hink_ssd1683_c3_promini_test.build_flags}
    -DBOARD_VARIANT_C3_LED5

[env:epd_398_se0398nz07a0_c3_promini_test]
extends = env:epd_398_se0398nz07a0_c3_promini
build_flags =
    ${env:epd_398_se0398nz07a0_c3_promini.build_flags}
    -DDEBUG_MODE=1

[env:epd_398_se0398nz07a0_c3_promini_test_led5]
extends = env:epd_398_se0398nz07a0_c3_promini_test
build_flags =
    ${env:epd_398_se0398nz07a0_c3_promini_test.build_flags}
    -DBOARD_VARIANT_C3_LED5

; ── 4.2" HINK SSD1683 三色屏 硬件自检（显示细节测试图，不联网；完成后保持唤醒并每 5 秒打印结果）──
; 测试图走正常的 2bpp 显示路径（colorBuf -> 黑/红两个平面）；色码 10（黄）应显示为红色。
[env:epd_42_hink_ssd1683_c3_promini_selftest]
extends = env:epd_42_hink_ssd1683_c3_promini
build_flags =
    ${env:epd_42_hink_ssd1683_c3_promini.build_flags}
    -DEPD_SELFTEST

[env:epd_42_hink_ssd1683_c3_promini_selftest_led5]
extends = env:epd_42_hink_ssd1683_c3_promini_selftest
build_flags =
    ${env:epd_42_hink_ssd1683_c3_promini_selftest.build_flags}
    -DBOARD_VARIANT_C3_LED5

; ══════════════════════════════════════════════════════════════════════════════
; ── 喵哎 MiaooAim 硬件：ESP32-S3 N16R8 + 4.2" JD79668 四色屏 ────────────────
;
; 这块板来自立创开源项目「ESP32S3 4.2寸三色墨水屏终端 喵哎-MiaooAim」。
; 硬件要点：
;   主控   ESP32-S3-WROOM-1U-N16R8（16MB Flash / 8MB 八线 PSRAM）
;   屏幕   4.2" 400×300 JD79668（黑白红黄四色，24P FPC 直插）
;   充电   TP4054
;   LDO    HE9073A33M5R（3.3V，静态 0.3µA）
;
; 引脚（已写进 src/config.h 的 BOARD_PROFILE_YD_ESP32_S3_N16R8 段）：
;   SCK=4  MOSI=5  CS=15  DC=7  RST=6  BUSY=16
;   配置键=GPIO0   电池ADC=未引出   板载RGB灯=无
;
; ⚠️ 注意：JD79668 与 SSD1683 是完全不同的驱动 IC，
;    不能互相套用 env，否则刷完白屏。
; ══════════════════════════════════════════════════════════════════════════════

[env:epd_42_gdem042f52_jd79668_yd_s3_n16r8]
extends = common
board = esp32-s3-devkitc-1
upload_speed = 460800
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions/inksight_16mb_ota.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_PROFILE_YD_ESP32_S3_N16R8
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DEPD_WIDTH=400
    -DEPD_HEIGHT=300
    -DEPD_PANEL_42_GDEM042F52
    -DEPD_BPP=2
    -DALLOW_INSECURE_FALLBACK=0

; 硬件自检版：不联网，直接画测试图。第一次上电先刷这个验证驱动。
[env:epd_42_gdem042f52_jd79668_yd_s3_n16r8_selftest]
extends = env:epd_42_gdem042f52_jd79668_yd_s3_n16r8
build_flags =
    ${env:epd_42_gdem042f52_jd79668_yd_s3_n16r8.build_flags}
    -DEPD_SELFTEST

; 调试版：每 1 分钟深睡唤醒一次，方便观察刷新行为。
[env:epd_42_gdem042f52_jd79668_yd_s3_n16r8_test]
extends = env:epd_42_gdem042f52_jd79668_yd_s3_n16r8
build_flags =
    ${env:epd_42_gdem042f52_jd79668_yd_s3_n16r8.build_flags}
    -DDEBUG_MODE=1
