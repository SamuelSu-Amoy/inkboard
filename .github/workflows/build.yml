# ═══════════════════════════════════════════════════════════════════════════
#  InkBoard 固件云编译
#
#  用法：Actions → Build InkBoard Firmware → Run workflow
#        1) 选屏幕（env）
#        2) 选固件类型（normal / test / selftest）
#        3) 等 5~10 分钟 → 页面底部下载 Artifacts
#
#  说明：
#   · normal   = 正式版，按设定的间隔唤醒刷新（几十分钟一次）
#   · test     = 调试版，每分钟唤醒一次，方便观察效果
#   · selftest = 自检版，不联网，直接画测试图，用来验证驱动是否匹配
#                （第一次刷一块新屏，先跑这个）
#
#  变体规则：
#   · 只有 base env 存在 _test / _selftest 变体时才生效
#   · 不存在会自动回退到 normal，并在日志里打黄色警告
# ═══════════════════════════════════════════════════════════════════════════

name: Build InkBoard Firmware

on:
  workflow_dispatch:
    inputs:
      env:
        description: '屏幕型号（见下方注释）'
        required: true
        default: 'epd_42_hink_ssd1683_c3_promini'
        type: choice
        options:
          # ─────────────────────────────────────────────────────────────
          # 喵哎 MiaooAim 硬件  ESP32-S3 N16R8 + 4.2" JD79668 四色
          # 引脚：SCK=4 MOSI=5 CS=15 DC=7 RST=6 BUSY=16
          # ⚠️ 只有这三个是 S3 的，其它 _c3_ / _wroom32e 刷了会一直重启
          # ─────────────────────────────────────────────────────────────
          - epd_42_gdem042f52_jd79668_yd_s3_n16r8           # 喵哎 · S3 · JD79668 四色
          # 自检版 / 调试版不用单独选，上面 mode 里挑 selftest 或 test 即可

          # ─────────────────────────────────────────────────────────────
          # 华为 3.98" 四色屏  SE0398NZ07  768×552  黑白黄红
          # 来源：华为 Nova 14 彩色显示手机壳拆屏
          # 注意：不支持局刷，只能全刷；FPC 印 A1 就选 A1
          # ─────────────────────────────────────────────────────────────
          - epd_398_se0398nz07a0_c3_promini        # A0 版 · C3 · 最常见，先试这个
          - epd_398_se0398nz07a1_c3_promini        # A1 版 · C3 · 排线印着 A1 时选

          # ─────────────────────────────────────────────────────────────
          # 4.2" 400×300 · 三色 / 四色（黑白红 / 黑白黄红）
          # 注意看驱动 IC，选错必白屏
          # ─────────────────────────────────────────────────────────────
          - epd_42_hink_ssd1683_c3_promini         # HINK SSD1683 · 黑白红 · 作者自用款
          - epd_42_uc8176_bwr_c3_promini           # UC8176 · 黑白红 · 微雪 4.2 B V1 / GDEW042Z15
          - epd_42_wft0cz15_bwr_c3_promini         # WFT0420CZ15 · 黑白红
          - epd_42_ssd1680_bwr_c3_promini          # SSD1680 · 黑白红 · DKE DEPG0420RWS830F0
          - epd_42_gdem042f52_jd79668_c3_promini   # JD79668 · 黑白红黄 · GDEM042F52（C3 版）
          - epd_42_depg0420ry683_ssd1683_c3_promini # SSD1683 · 黑白红黄 · DKE DEPG0420RY683

          # ─────────────────────────────────────────────────────────────
          # 4.2" 400×300 · 纯黑白
          # ─────────────────────────────────────────────────────────────
          - epd_42_wsv2_ssd1683_c3_promini         # 微雪 V2 · 黑白 · SSD1683
          - epd_42_zhongjingyuan_bw_ssd1683_c3_promini # 中景园 · 黑白 · SSD1683
          - epd_42_zhongjingyuan_bw_gxepd2_gye042a87_c3_promini # 中景园 GYE042A87 · GxEPD2
          - epd_42_gxepd2_gdey042t81_ssd1683_c3_promini # GDEY042T81 · 黑白（GDEW042T2 替代款）
          - epd_42_gxepd2_gdew042t2_il0398_c3_promini   # GDEW042T2 · 黑白 · IL0398
          - epd_42_gxepd2_gdew042m01_uc8176_c3_promini  # GDEW042M01 · UC8176
          - epd_42_wft0cz15_bw_c3_promini          # WFT0420CZ15 · 黑白
          - epd_42_ssd1680_bw_c3_promini           # SSD1680 · 黑白
          - epd_42_se0420nq04_c3_promini           # SE0420NQ04 · 黑白

          # ─────────────────────────────────────────────────────────────
          # 其它主控板（换了 WROOM-32E / S3 才需要）
          # ─────────────────────────────────────────────────────────────
          - epd_42_hink_ssd1683_wroom32e           # HINK SSD1683 · WROOM-32E
          - epd_42_hink_ssd1683_yd_s3_n16r8        # HINK SSD1683 · ESP32-S3 N16R8
          - epd_398_se0398nz07a0_wroom32e          # 华为 3.98 A0 · WROOM-32E
          - epd_398_se0398nz07a0_yd_s3_n16r8       # 华为 3.98 A0 · S3 N16R8
          - epd_398_se0398nz07a1_yd_s3_n16r8       # 华为 3.98 A1 · S3 N16R8

      mode:
        description: '固件类型'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal    # 正式版：按设定间隔唤醒（省电）
          - test      # 调试版：每分钟唤醒一次（看效果用）
          - selftest  # 自检版：不联网，直接画测试图（新屏先用这个）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: 锁定 espressif32 版本
        # 修复新版框架 setCACertBundle() 由 1 参数变 2 参数导致的编译失败
        # 已经手动改过的话，这条 sed 不会匹配，无副作用
        run: |
          if grep -qE '^platform = espressif32$' firmware/platformio.ini; then
            sed -i 's/^platform = espressif32$/platform = espressif32@6.9.0/' firmware/platformio.ini
            echo "已锁定为 espressif32@6.9.0"
          else
            echo "已锁定或使用自定义平台，跳过"
          fi
          grep -n 'platform = ' firmware/platformio.ini | head -3

      - name: 缓存 PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/boards/*.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: 选择实际编译环境
        run: |
          BASE="${{ inputs.env }}"
          MODE="${{ inputs.mode }}"
          cd firmware

          echo "基础环境：$BASE"
          echo "固件类型：$MODE"

          # 根据 mode 拼出目标 env
          if [ "$MODE" = "normal" ]; then
            ENV="$BASE"
          else
            TARGET="${BASE}_${MODE}"
            if pio project config 2>/dev/null | grep -qE "^env:${TARGET}$"; then
              ENV="$TARGET"
              echo "✔ 找到 ${MODE} 变体：$ENV"
            else
              ENV="$BASE"
              echo "::warning::${BASE} 没有 _${MODE} 变体，已回退到正式版"
            fi
          fi

          # 兜底校验
          if ! pio project config 2>/dev/null | grep -qE "^env:${ENV}$"; then
            echo "::error::环境 ${ENV} 不存在，可用环境如下："
            pio project config 2>/dev/null | grep -oE '^env:[^ ]+' | sed 's/^env://' | sort | head -50
            exit 1
          fi

          # 芯片提示，防止刷错
          case "$ENV" in
            *_c3_promini*|*_c3_std*|*_c3_wroom02*)
              echo "::notice::这是 ESP32-C3 固件，请确认你的板子是 C3" ;;
            *_yd_s3_n16r8*)
              echo "::notice::这是 ESP32-S3 固件，请确认你的板子是 S3" ;;
            *_wroom32e*|*_wroom02*)
              echo "::notice::这是 ESP32-WROOM 固件，请确认你的板子是 WROOM" ;;
          esac

          echo "编译环境：$ENV"
          echo "ENV=$ENV" >> "$GITHUB_ENV"

      - name: 编译
        working-directory: firmware
        run: |
          pio run -e "$ENV" 2>&1 | tee build.log

      - name: 失败时打印错误摘要
        if: failure()
        working-directory: firmware
        run: |
          echo "=========== 错误行 ==========="
          grep -inE "error|failed|unknown|not found" build.log | head -30 || true
          echo "=========== 日志尾部 ==========="
          tail -60 build.log || true

      - name: 收集产物
        if: success()
        run: |
          mkdir -p out
          B="firmware/.pio/build/${ENV}"
          for f in firmware.bin firmware_merged.bin bootloader.bin partitions.bin boot_app0.bin; do
            if [ -f "$B/$f" ]; then
              cp "$B/$f" "out/${ENV}_${f}"
            fi
          done
          echo "------------ 产出 ------------"
          ls -lh out
          echo ""
          echo "烧录用 *_merged.bin，地址 0x0"

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: inkboard-${{ inputs.env }}-${{ inputs.mode }}
          path: out/
          retention-days: 30
